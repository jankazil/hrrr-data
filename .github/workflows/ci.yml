name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add Python versions after verifying the scientific dependencies on them.
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install pygrib source-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libeccodes-dev
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test (pytest)
        run: pytest

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ci-lint
      - name: Install Ruff
        run: conda install --yes --name ci-lint --override-channels --channel conda-forge ruff
      - name: Lint (Ruff)
        run: conda run --name ci-lint ruff check .
      - name: Check formatting (Ruff)
        run: conda run --name ci-lint ruff format --check .
